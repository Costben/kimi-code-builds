name: Build patched Kimi Code

# Builds the native `kimi` executable from an upstream tag with patches/ applied
# and publishes it as Release `v<version>` in the layout the patched updater
# reads (see patches/kimi-code-update-feed.patch):
#
#   releases/latest/download/latest        plain-text version
#   releases/latest/download/latest.json   rollout manifest (fully rolled out)
#   releases/latest/download/canary.json   copy of latest.json
#   releases/download/v<version>/manifest.json + kimi-code-<target>.zst
#
# The native steps mirror upstream's `_native-build.yml` (local signing profile:
# ad-hoc on macOS, unsigned on Windows). `upstream-release-watch.yml` dispatches
# this for every new stable upstream release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag, e.g. @moonshot-ai/kimi-code@2.4.0 (blank = latest stable release)"
        required: false
        type: string
      force:
        description: "Rebuild even when the Release already holds every asset"
        required: false
        type: boolean
        default: false

concurrency:
  group: kimi-code-builds
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: MoonshotAI/kimi-code

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.missing.outputs.build }}
    steps:
      - name: Resolve upstream tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED"
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          fi
          version="${tag##*@}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a stable release tag" >&2
            exit 1
          fi
          echo "Upstream $tag -> v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip when the Release is complete
        id: missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pick.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          assets="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          build=false
          for name in manifest.json latest latest.json canary.json \
                      kimi-code-darwin-arm64.zst kimi-code-win32-x64.zst kimi-code-linux-x64.zst; do
            grep -Fxq "$name" <<< "$assets" || build=true
          done
          if [ "$FORCE" = "true" ]; then build=true; fi
          echo "build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/patch-verify.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}

  native:
    name: Native bundle (${{ matrix.target }})
    needs: [resolve, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025-vs2026
            target: win32-x64
          - os: ubuntu-24.04
            target: linux-x64
    steps:
      - name: Checkout upstream tag
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1

      - name: Checkout build repo
        uses: actions/checkout@v6
        with:
          path: .builds

      - name: Apply patches
        shell: bash
        run: bash .builds/scripts/apply-patches.sh .

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate built-in model catalog
        shell: bash
        run: |
          CATALOG_FILE="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          node apps/kimi-code/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "KIMI_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Check web assets
        run: node apps/kimi-code/scripts/check-web-assets.mjs

      - name: Build native executable
        run: pnpm --filter @moonshot-ai/kimi-code run build:native:sea

      - name: Smoke test native executable
        run: pnpm --filter @moonshot-ai/kimi-code run test:native:smoke

      - name: Package native artifact
        run: pnpm --filter @moonshot-ai/kimi-code run package:native

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: kimi-code-native-${{ matrix.target }}
          retention-days: 3
          path: |
            apps/kimi-code/dist-native/artifacts/kimi-code-${{ matrix.target }}.zip
            apps/kimi-code/dist-native/artifacts/kimi-code-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  publish:
    needs: [resolve, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout upstream tag (manifest script)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1
          sparse-checkout: apps/kimi-code/scripts/native

      - name: Download native artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: kimi-code-native-*
          path: dist
          merge-multiple: true

      - name: Produce manifest and update feeds
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node apps/kimi-code/scripts/native/produce-manifest.mjs dist "$TAG"
          jq -e --arg v "$VERSION" '.version == $v' dist/manifest.json
          printf '%s\n' "$VERSION" > dist/latest
          jq -n --arg v "$VERSION" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, version: $v, publishedAt: $t, rollout: []}' > dist/latest.json
          cp dist/latest.json dist/canary.json
          ls -l dist

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          release="v$VERSION"
          if ! gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            {
              echo "## Kimi Code v$VERSION"
              echo
              echo "- 基于上游 \`$TAG\` 构建"
              echo "- 支持 ACP 客户端（如 Paseo）在回合运行中插入消息，效果与 Ctrl+S 引导一致"
              echo "- 应用内更新改为从本仓库的 Release 获取"
            } > notes.md
            gh release create "$release" --repo "$GITHUB_REPOSITORY" \
              --title "Kimi Code v$VERSION - 支持在 ACP 中引导运行中的回合" \
              --notes-file notes.md --latest
          fi
          # The feeds go up last: a client that sees the new `latest.json` must
          # already find the manifest and binaries it points at.
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/kimi-code-*.zst dist/kimi-code-*.zst.sha256 \
            dist/kimi-code-*.tar.gz dist/kimi-code-*.tar.gz.sha256 \
            dist/kimi-code-*.zip dist/kimi-code-*.zip.sha256 \
            dist/manifest.json
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/latest dist/latest.json dist/canary.json
