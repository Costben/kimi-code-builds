name: Watch upstream releases

# Dispatches `build.yml` once upstream publishes a stable release this repo has
# not built yet. GitHub cannot deliver MoonshotAI/kimi-code events here, so this
# polls every 30 minutes, the same cadence as Costben/paseo-statusbar-builds.
# Upstream's `releases/latest` never points at a canary prerelease, so only
# stable versions are followed.
on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes, off the hour marks
  workflow_dispatch:

concurrency:
  group: upstream-release-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  UPSTREAM_REPO: MoonshotAI/kimi-code

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch a build when the latest upstream release is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          version="${tag##*@}"
          echo "Upstream latest: $tag"

          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -Fxq latest.json; then
            echo "v$version is already published."
            exit 0
          fi

          # A build that is running will publish on its own; one that failed
          # within the hour is retried hourly, not on every tick.
          cutoff="$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --limit 10 \
            --json status,createdAt \
            | jq --arg cutoff "$cutoff" \
                '[.[] | select(.status == "in_progress" or .status == "queued" or .createdAt >= $cutoff)] | length')"
          if [ "$recent" -gt 0 ]; then
            echo "A build is running or ran within the hour; waiting."
            exit 0
          fi

          echo "Dispatching build.yml for $tag"
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$tag"
